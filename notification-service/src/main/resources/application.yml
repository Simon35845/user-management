spring:
  application:
    name: notification-service

  datasource:
    url: jdbc:postgresql://localhost:5433/postgres
    username: postgres
    password: 12345678
    driver-class-name: org.postgresql.Driver

  jpa:
    show-sql: true
    hibernate:
      ddl-auto: validate
    properties:
      hibernate:
        dialect: org.hibernate.dialect.PostgreSQLDialect

  flyway:
    enabled: true
    baseline-on-migrate: true

  mail:
    host: localhost
    port: 1025
    username: username
    password: password
    properties:
      mail.smtp.auth: false
      mail.smtp.starttls: false

server:
  port: 8081