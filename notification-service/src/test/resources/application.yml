spring:
  application:
    name: notification-service
  cloud:
    config:
      enabled: false
    discovery:
      enabled: false
    loadbalancer:
      enabled: false
  kafka:
    bootstrap-servers: localhost:9092
    consumer:
      auto-startup: false
    listener:
      auto-startup: false

openapi:
  server:
    url: http://localhost:8080
    description: API Gateway

eureka:
  client:
    enabled: false
    register-with-eureka: false
    fetch-registry: false